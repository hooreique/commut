[package]
name = "commut-rust-spec-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
hkdf = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
portable-pty = "0.9"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[build-dependencies]
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["http2", "charset", "json", "rustls-tls"] }
tokio-tungstenite = "0.28"
urlencoding = "2.1"
